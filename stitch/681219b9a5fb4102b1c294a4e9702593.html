<script>
        // Micro-interaction: Simulate the SnapSwitch mechanic visually
        const playerSwitch = document.getElementById('player-switch');
        const playfield = document.getElementById('playfield');
        let isOnRight = true;

        function toggleSwitch() {
            // Add flash effect
            playerSwitch.style.backgroundColor = '#ffffff';
            playerSwitch.style.boxShadow = '0 0 30px rgba(255,255,255,0.8)';
            
            setTimeout(() => {
                playerSwitch.style.backgroundColor = '';
                playerSwitch.style.boxShadow = '';
                
                if (isOnRight) {
                    playerSwitch.style.right = 'auto';
                    playerSwitch.style.left = '-7px';
                } else {
                    playerSwitch.style.left = 'auto';
                    playerSwitch.style.right = '-7px';
                }
                isOnRight = !isOnRight;
            }, 50);
        }

        // Listen for click on playfield or spacebar
        playfield.addEventListener('click', toggleSwitch);
        document.addEventListener('keydown', (e) => {
            if (e.code === 'Space') {
                e.preventDefault(); // Prevent scrolling
                toggleSwitch();
            }
        });
    </script>
