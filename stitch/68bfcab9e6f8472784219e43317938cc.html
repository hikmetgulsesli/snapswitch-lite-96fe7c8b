<body class="bg-background text-on-surface h-screen w-screen flex items-center justify-center overflow-hidden font-body-md text-body-md relative">

<button class="text-on-surface-variant hover:text-primary transition-colors flex items-center justify-center">

        00:42.8
    </div>
<div class="absolute top-hud-safe-area left-hud-safe-area z-0 opacity-20 pointer-events-none font-label-mono text-label-mono text-secondary-fixed">
        MULTIPLIER: x4
    </div>
<script>
        // Simple JS for the custom switch toggles since we can't use complex peer classes easily with the exact required design
        document.querySelectorAll('input[type="checkbox"].switch-checkbox').forEach(checkbox => {
            checkbox.addEventListener('change', (e) => {
                const dot = e.target.parentElement.querySelector('div:last-child');
                if(e.target.checked) {
                    dot.classList.add('translate-x-6', '!bg-on-primary');
                    e.target.nextElementSibling.classList.add('bg-primary-fixed-dim', 'border-primary-fixed-dim');
                } else {
                    dot.classList.remove('translate-x-6', '!bg-on-primary');
                    e.target.nextElementSibling.classList.remove('bg-primary-fixed-dim', 'border-primary-fixed-dim');
                }
            });
            // trigger initial state
            if(checkbox.checked) {
                 checkbox.nextElementSibling.classList.add('bg-primary-fixed-dim', 'border-primary-fixed-dim');
            }
        });
    </script>
